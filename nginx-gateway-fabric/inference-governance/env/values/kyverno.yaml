features:
  backgroundScan:
    # Short interval so the Finale's PolicyReports fill quickly after a reset.
    backgroundScanInterval: 30s
admissionController:
  replicas: 1
  initContainer:
    image:
      pullPolicy: Never      # images are preloaded with `make images` (see env/images.sh)
  container:
    image:
      pullPolicy: Never
backgroundController:
  replicas: 1
  image:
    pullPolicy: Never
reportsController:
  replicas: 1
  image:
    pullPolicy: Never
cleanupController:
  replicas: 1
  image:
    pullPolicy: Never
# Hooks: keep the pre-delete webhook cleanup (pinned tag, preloaded), drop the CRD migration job
# (fresh install, nothing to migrate). The test pods only run on `helm test`.
webhooksCleanup:
  image:
    tag: v1.19.2
    pullPolicy: Never
crds:
  migration:
    enabled: false
test:
  image:
    tag: v1.19.2
    pullPolicy: Never
