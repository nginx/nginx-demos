# A stand-in for an external model API ("some vendor"). It runs in-cluster so the demo works
# offline, but scenarios/keep-serving/fallback.yaml (repo only) reaches it through an ExternalName Service exactly as it would a real vendor.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vendor-api
  namespace: vendor
spec:
  replicas: 1
  selector:
    matchLabels: {app: vendor-api}
  template:
    metadata:
      labels: {app: vendor-api}
    spec:
      containers:
      - name: sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0   # keep in sync with versions.env
        imagePullPolicy: Never                           # preloaded by env/images.sh
        args: [--model, vendor-frontier-model, --served-model-name, vendor-frontier-model, auto,
               --port, "8000", --dataset-path, /data/dataset.sqlite3, --time-to-first-token, 300ms]
        ports: [{name: http, containerPort: 8000}]
        readinessProbe: {httpGet: {path: /health, port: http}}
        resources: {requests: {cpu: 10m, memory: 64Mi}}
        volumeMounts: [{name: dataset, mountPath: /data}]
      volumes:
      # Built by env/install-workloads.sh from env/datasets/vendor.txt.
      - name: dataset
        configMap: {name: dataset-vendor, items: [{key: dataset.sqlite3, path: dataset.sqlite3}]}
---
apiVersion: v1
kind: Service
metadata:
  name: vendor-api
  namespace: vendor
spec:
  selector: {app: vendor-api}
  ports: [{name: http, port: 80, targetPort: http}]
