apiVersion: gateway.nginx.org/v1alpha1
kind: RateLimitPolicy
metadata:
  name: assistant-tenant-rate-limit
  namespace: team-assistant
  labels:
    app.kubernetes.io/managed-by: kyverno
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: assistant
  rateLimit:
    rejectCode: 429
    local:
      rules:
      - key: team-assistant
        rate: 2r/s
        burst: 2
        noDelay: true
