# Everything `make up` installs must pass every policy, otherwise the platform fights itself
# (and the Finale's PolicyReports would show false positives).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: baseline-check
policies:
- ../p2-restrict-model-access/policy.yaml
- ../p3-require-cost-center/policy.yaml
- ../p4-restrict-gpu-class-by-tier/policy.yaml
- ../p6-inference-backends-only/policy.yaml
- ../p7-deny-failopen-for-regulated/policy.yaml
resources:
- ../../env/manifests/30-routes.yaml
- baseline-models.yaml
clusterResources: [../_shared/cluster.yaml]
results:
- {policy: restrict-model-access, isValidatingPolicy: true, kind: HTTPRoute, resources: [team-assistant/assistant, team-research/research], result: pass}
- {policy: inference-backends-only, isValidatingPolicy: true, kind: HTTPRoute, resources: [team-assistant/assistant, team-research/research], result: pass}
- {policy: require-cost-center, isValidatingPolicy: true, kind: Deployment, resources: [models/llama-8b, models/llama-70b, team-research/research-ft], result: pass}
- {policy: restrict-gpu-class-by-tier, isValidatingPolicy: true, kind: Deployment, resources: [models/llama-70b, team-research/research-ft], result: pass}
