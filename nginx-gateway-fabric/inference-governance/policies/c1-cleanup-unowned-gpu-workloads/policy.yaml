# C1 (cleanup, no clip installs it): on a schedule, delete model servers in tenant namespaces that
# nobody pays for. The Finale's background scan reports them (require-cost-center); this removes
# them and frees the GPU. Same test as P3: a model-server workload, or its pods, with no
# cost-center label. Platform namespaces are exempt; an unlabelled namespace is a tenant.
#
# Deleting is irreversible, so roll it out after the report: run P3 in Audit, read the
# PolicyReports, tell the owners, then install this. A long schedule gives teams time to label.
# Deployments, StatefulSets and Jobs only: their pods go with them (deletionPropagationPolicy).
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: cleanup-unowned-gpu-workloads
  annotations:
    policies.kyverno.io/title: Clean up unowned GPU workloads
    policies.kyverno.io/description: Deletes model-server workloads in tenant namespaces that have no cost-center label.
spec:
  schedule: "0 * * * *"   # hourly
  deletionPropagationPolicy: Foreground
  matchConstraints:
    resourceRules:
    - apiGroups: [apps]
      apiVersions: [v1]
      resources: [deployments, statefulsets]
    - apiGroups: [batch]
      apiVersions: [v1]
      resources: [jobs]
  variables:
  - name: podLabels
    expression: object.spec.?template.?metadata.?labels.orValue({})
  - name: isTenant
    expression: >-
      resource.Get('v1', 'namespaces', '', object.metadata.namespace).metadata.?labels[?'tenant']
      .orValue('') != 'platform'
  conditions:
  - name: tenant-namespace
    expression: variables.isTenant
  - name: model-server
    expression: variables.podLabels[?'inference.example.com/role'].orValue('') == 'model-server'
  - name: unowned
    expression: >-
      object.metadata.?labels[?'cost-center'].orValue('') == '' ||
      variables.podLabels[?'cost-center'].orValue('') == ''
