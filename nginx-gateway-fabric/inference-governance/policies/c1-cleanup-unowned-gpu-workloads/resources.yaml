# The Shadow GPU model: no cost-center anywhere. Deleted.
apiVersion: apps/v1
kind: Deployment
metadata: {name: unowned-model, namespace: team-assistant}
spec:
  selector: {matchLabels: {a: b}}
  template:
    metadata: {labels: {a: b, inference.example.com/role: model-server, gpu.example.com/class: h100}}
    spec: {containers: [{name: sim, image: sim}]}
---
# Owner on the Deployment but not on its pods: still unowned where it runs. Deleted.
apiVersion: apps/v1
kind: Deployment
metadata: {name: owner-not-on-pods, namespace: team-assistant, labels: {cost-center: team-assistant}}
spec:
  selector: {matchLabels: {a: b}}
  template:
    metadata: {labels: {a: b, inference.example.com/role: model-server}}
    spec: {containers: [{name: sim, image: sim}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: unowned-sts, namespace: team-assistant}
spec:
  serviceName: x
  selector: {matchLabels: {a: b}}
  template:
    metadata: {labels: {a: b, inference.example.com/role: model-server}}
    spec: {containers: [{name: sim, image: sim}]}
---
# A namespace with no tenant label is a tenant, not platform. Deleted.
apiVersion: apps/v1
kind: Deployment
metadata: {name: unlabelled-ns-model, namespace: no-labels}
spec:
  selector: {matchLabels: {a: b}}
  template:
    metadata: {labels: {a: b, inference.example.com/role: model-server}}
    spec: {containers: [{name: sim, image: sim}]}
---
# Owned, on the workload and its pods. Kept.
apiVersion: apps/v1
kind: Deployment
metadata: {name: owned-model, namespace: team-assistant, labels: {cost-center: team-assistant}}
spec:
  selector: {matchLabels: {a: b}}
  template:
    metadata: {labels: {a: b, inference.example.com/role: model-server, cost-center: team-assistant}}
    spec: {containers: [{name: sim, image: sim}]}
---
# Not a model server. Kept.
apiVersion: apps/v1
kind: Deployment
metadata: {name: web-frontend, namespace: team-assistant}
spec:
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec: {containers: [{name: web, image: nginx}]}
---
# Platform namespace: the platform's own models are out of scope. Kept.
apiVersion: apps/v1
kind: Deployment
metadata: {name: platform-model, namespace: models}
spec:
  selector: {matchLabels: {a: b}}
  template:
    metadata: {labels: {a: b, inference.example.com/role: model-server}}
    spec: {containers: [{name: sim, image: sim}]}
