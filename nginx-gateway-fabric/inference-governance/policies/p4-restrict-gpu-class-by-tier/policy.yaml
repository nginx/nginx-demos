# P4 ("Shadow GPU"): standard-tier tenants can't run model servers on h100 GPUs.
# Tier comes from the namespace label; a namespace without one is treated as standard.
# Matches bare Pods and every workload controller. A workload asks for h100 with the pod label
# gpu.example.com/class or a nodeSelector on it. The demo's GPUs are simulated; on a real cluster also check node affinity
# and, with Dynamic Resource Allocation, the ResourceClaim's DeviceClass.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-gpu-class-by-tier
  annotations:
    policies.kyverno.io/title: Restrict GPU class by tier
    policies.kyverno.io/description: Only premium-tier namespaces may run workloads on the h100 GPU class.
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
    - apiGroups: [apps]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [deployments, statefulsets, daemonsets, replicasets]
    - apiGroups: [batch]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [jobs, cronjobs]
  matchConditions:
  - name: requests-h100
    expression: >-
      [object.kind == 'Pod' ? object : object.kind == 'CronJob' ?
        object.spec.?jobTemplate.?spec.?template.orValue({}) : object.spec.?template.orValue({})]
      .exists(t,
        t.?metadata.?labels[?'gpu.example.com/class'].orValue('') == 'h100' ||
        t.?spec.?nodeSelector[?'gpu.example.com/class'].orValue('') == 'h100')
  variables:
  - name: tier
    expression: >-
      resource.Get('v1', 'namespaces', '', object.metadata.namespace).metadata.?labels[?'tier'].orValue('standard')
  # Objects made by a controller this policy already checks are reported once, at the controller:
  # a Deployment's ReplicaSet, and Pods from a StatefulSet, DaemonSet, Job or a Deployment's
  # ReplicaSet. Kyverno's resourceFilters skip ReplicaSets at admission but not in background scans
  # of CEL policies, so both kinds need this. A tenant's own ReplicaSet (no Deployment above it)
  # and its Pods are still checked.
  - name: checkedAtController
    expression: >-
      (object.kind == 'ReplicaSet' && object.metadata.?ownerReferences.orValue([]).exists(o,
        o.?controller.orValue(false) && o.kind == 'Deployment')) ||
      (object.kind == 'Pod' && object.metadata.?ownerReferences.orValue([]).exists(o,
        o.?controller.orValue(false) && (o.kind in ['StatefulSet', 'DaemonSet', 'Job'] ||
          (o.kind == 'ReplicaSet' &&
           resource.Get('apps/v1', 'replicasets', object.metadata.namespace, o.name)
             .metadata.?ownerReferences.orValue([]).exists(p, p.?controller.orValue(false) && p.kind == 'Deployment')))))
  validations:
  - expression: >-
      variables.checkedAtController || variables.tier == 'premium' || object.metadata.namespace == 'models'
    messageExpression: >-
      object.metadata.namespace + ' (' + variables.tier + ' tier) can\'t use h100 GPUs: premium tier only, '
      + 'ask the platform team'
    message: h100 GPUs are for premium-tier namespaces only; ask the platform team
