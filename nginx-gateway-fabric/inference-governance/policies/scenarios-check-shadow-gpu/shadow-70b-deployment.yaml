apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadow-70b
  namespace: team-assistant
  labels: {model-pool: shadow-70b}
spec:
  replicas: 1
  selector:
    matchLabels: {model-pool: shadow-70b}
  template:
    metadata:
      labels:
        model-pool: shadow-70b
        gpu.example.com/class: h100
        inference.example.com/role: model-server
    spec:
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.0.0
          imagePullPolicy: Never # preloaded by env/images.sh
          # Served as "<name>" and "auto": clients always ask for "auto", the reply names the real model.
          args: [--model, shadow-70b, --served-model-name, shadow-70b, auto, --port, "8000", --dataset-path, /data/dataset.sqlite3, --time-to-first-token, 200ms, --inter-token-latency, 20ms, --max-num-seqs, "8"]
          ports: [{name: http, containerPort: 8000}]
          readinessProbe: {httpGet: {path: /health, port: http}}
          resources: {requests: {cpu: 10m, memory: 64Mi}}
          volumeMounts: [{name: dataset, mountPath: /data}]
      volumes:
        - name: dataset
          configMap: {name: dataset-general, items: [{key: dataset.sqlite3, path: dataset.sqlite3}]}
