# Allowed: a tenant's own hostname, one of its wildcard hostnames, and a platform route without
# hostnames (platform namespaces are exempt).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: own-hostname, namespace: team-assistant}
spec:
  parentRefs: [{name: inference-gateway, namespace: gateway}]
  hostnames: [assistant.example]
  rules: [{backendRefs: [{group: inference.networking.k8s.io, kind: InferencePool, name: llama-8b, namespace: models}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: own-wildcard, namespace: team-assistant}
spec:
  parentRefs: [{name: inference-gateway, namespace: gateway}]
  hostnames: [assistant-pro.example]
  rules: [{backendRefs: [{group: inference.networking.k8s.io, kind: InferencePool, name: llama-8b, namespace: models}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: platform-any-host, namespace: models}
spec:
  parentRefs: [{name: inference-gateway, namespace: gateway}]
  rules: [{backendRefs: [{group: inference.networking.k8s.io, kind: InferencePool, name: llama-8b}]}]
---
# Denied: another tenant's hostname with a more specific path (the takeover this policy stops), a
# tenant route with no hostnames, a lookalike that only matches if the dot isn't literal, a second
# label where the wildcard covers one, and a tenant with no allowlist entry.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: steal-assistant, namespace: team-research}
spec:
  parentRefs: [{name: inference-gateway, namespace: gateway}]
  hostnames: [assistant.example]
  rules:
  - matches: [{path: {type: PathPrefix, value: /v1}}]
    backendRefs: [{group: inference.networking.k8s.io, kind: InferencePool, name: research-ft}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: no-hostnames, namespace: team-assistant}
spec:
  parentRefs: [{name: inference-gateway, namespace: gateway}]
  rules: [{backendRefs: [{group: inference.networking.k8s.io, kind: InferencePool, name: llama-8b, namespace: models}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: dot-lookalike, namespace: team-assistant}
spec:
  parentRefs: [{name: inference-gateway, namespace: gateway}]
  hostnames: [assistantXexample]
  rules: [{backendRefs: [{group: inference.networking.k8s.io, kind: InferencePool, name: llama-8b, namespace: models}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: two-labels, namespace: team-assistant}
spec:
  parentRefs: [{name: inference-gateway, namespace: gateway}]
  hostnames: [assistant-pro.evil.example]
  rules: [{backendRefs: [{group: inference.networking.k8s.io, kind: InferencePool, name: llama-8b, namespace: models}]}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: no-allowlist, namespace: team-unlabelled}
spec:
  parentRefs: [{name: inference-gateway, namespace: gateway}]
  hostnames: [unlabelled.example]
  rules: [{backendRefs: [{group: inference.networking.k8s.io, kind: InferencePool, name: llama-8b, namespace: models}]}]
