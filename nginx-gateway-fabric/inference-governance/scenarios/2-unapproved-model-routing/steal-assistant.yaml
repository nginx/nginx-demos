# Not shown in the clip: team-research attaching a route to team-assistant's hostname. The longer
# path beats team-assistant's "/" across namespaces, so without P3 it would take every customer
# request to assistant.example and send it to a model team-research runs. P3 denies it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: steal-assistant
  namespace: team-research
spec:
  parentRefs: [{name: inference-gateway, namespace: gateway}]
  hostnames: [assistant.example]
  rules:
  - matches: [{path: {type: PathPrefix, value: /v1}}]
    backendRefs:
    - {group: inference.networking.k8s.io, kind: InferencePool, name: research-ft}
