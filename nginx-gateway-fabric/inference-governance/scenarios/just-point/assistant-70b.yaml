# Assistant Pro still needs a better model, so team-assistant upgrades its assistant route to the
# big shared model.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: assistant
  namespace: team-assistant
spec:
  parentRefs: [{name: inference-gateway, namespace: gateway}]
  hostnames: [assistant.example]
  rules:
  - backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: llama-70b          # was: llama-8b
      namespace: models
