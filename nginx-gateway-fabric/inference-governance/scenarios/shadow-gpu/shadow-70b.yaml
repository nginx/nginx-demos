# Source: llm-d-router-gateway/templates/epp.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadow-70b-epp
  namespace: team-assistant
  labels:
    app.kubernetes.io/name: shadow-70b-epp
    app.kubernetes.io/version: "0.0.0"
    llm-d.ai/igw-mode: llm-d-router-gateway
spec:
  replicas: 1
  strategy:
    # The current recommended EPP deployment pattern is to have a single active replica. This ensures
    # optimal performance of the stateful operations such prefix cache aware scorer.
    # The Recreate strategy the old replica is killed immediately, and allow the new replica(s) to
    # quickly take over. This is particularly important in the high availability set up with leader
    # election, as the rolling update strategy would prevent the old leader being killed because
    # otherwise the maxUnavailable would be 100%.
    #
    # With replicas > 1 this also means the Deployment never reports Available=True,
    # because standby replicas stay NotReady by design. Set router.epp.deploymentStrategy
    # if that blocks your tooling; see "Multi-replica EPP and Helm --wait" in the chart README.
    type: Recreate
  selector:
    matchLabels:
      llm-d-router-gateway: shadow-70b-epp
  template:
    metadata:
      labels:
        llm-d-router-gateway: shadow-70b-epp
        llm-d.ai/igw-mode: llm-d-router-gateway
      annotations:
        checksum/config: 9b89ac17f23e02e9a81715176480bf950067b1b1c88b7e7f8e81e38d3d42d55f
    spec:
      serviceAccountName: shadow-70b-epp
      # Conservatively, this timeout should mirror the longest grace period of the pods within the pool
      terminationGracePeriodSeconds: 130
      containers:
        - name: epp
          image: ghcr.io/llm-d/llm-d-router-endpoint-picker:v0.11.0
          imagePullPolicy: Never
          args:
            - --pool-name
            - shadow-70b
            # The pool namespace is optional because EPP can default to the NAMESPACE env var.
            - --pool-namespace
            - team-assistant
            - --pool-group
            - "inference.networking.k8s.io"
            - --zap-encoder
            - "json"
            - --config-file
            - "/config/default-plugins.yaml"
            - --grpc-health-port
            - "9003"
            # Pass additional flags via the router.epp.flags field in values.yaml.
            # Render them as --flag=value so boolean values are parsed correctly.
            - --tracing=false
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 128Mi
          ports:
            - name: grpc
              containerPort: 9002
            - name: grpc-health
              containerPort: 9003
            - name: metrics
              containerPort: 9090
          livenessProbe:
            grpc:
              port: 9003
              service: inference-extension
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 9003
              service: inference-extension
            periodSeconds: 2
          # Allow in-flight gRPC streams to drain and give Envoy health checks
          # time to detect termination and shift traffic to standby endpoints before SIGTERM.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: plugins-config-volume
              mountPath: "/config"
      volumes:
        - name: plugins-config-volume
          configMap:
            name: shadow-70b-epp
---

