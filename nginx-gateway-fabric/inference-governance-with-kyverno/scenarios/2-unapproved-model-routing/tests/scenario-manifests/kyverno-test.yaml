# The exact manifests this scenario's clips apply get the verdict the clip claims, so the YAML
# can't drift from what's on screen without make test failing.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: scenario-manifests-just-point
policies: [../../policies/p2-restrict-model-access.yaml]
resources: [../../assistant-70b.yaml]
clusterResources: [../../../_shared/cluster.yaml]
results:
# The assistant route switched to models/llama-70b, which team-assistant isn't approved for.
- {policy: restrict-model-access, isValidatingPolicy: true, kind: HTTPRoute, resources: [team-assistant/assistant], result: fail}
