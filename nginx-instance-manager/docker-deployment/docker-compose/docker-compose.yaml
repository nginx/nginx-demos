services:
    clickhouse:
     image: clickhouse/clickhouse-server:23-alpine@sha256:377a5a2dbd3c7396524b3b3bc051a521cadb54b086079e8e175cf644d3b0821a
     ports:
     - "9000:9000"
     environment:
     - CLICKHOUSE_USER=${NIM_CLICKHOUSE_USERNAME}
     - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
     - CLICKHOUSE_PASSWORD=${NIM_CLICKHOUSE_PASSWORD}
     volumes:
     - db-data:/var/lib/clickhouse
     ulimits:
      nproc: 65535
      nofile:
       soft: 262144
       hard: 262144

    nim:
     image: ${NIM_IMAGE}
     depends_on:
     - clickhouse
     restart: unless-stopped
     ports:
     - "443:443"
     environment:
     - NIM_LICENSE=${NIM_LICENSE}
     - NIM_USERNAME=${NIM_USERNAME}
     - NIM_PASSWORD=${NIM_PASSWORD}
     - NIM_CLICKHOUSE_ADDRESSPORT=${NIM_CLICKHOUSE_ADDRESSPORT}
     - NIM_CLICKHOUSE_USERNAME=${NIM_CLICKHOUSE_USERNAME}
     - NIM_CLICKHOUSE_PASSWORD=${NIM_CLICKHOUSE_PASSWORD}
     - NIM_LICENSE_MODE_OF_OPERATION=${NIM_LICENSE_MODE_OF_OPERATION}
     volumes:
     - nms-data:/var/lib/nms

volumes:
     db-data:
     nms-data:
