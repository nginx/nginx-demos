# docker/smoke-httpbin.conf — nginx + httpbin smoke-test config.
# Proxies to httpbin on port 9000 (built-in echo) and httpbin:8080 (go-httpbin).

load_module /usr/local/nginx/modules/ngx_http_trace_module.so;

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    trace_zone        trace_zone  2m;
    trace_max_sessions   32;
    trace_max_transactions 64;
    trace_retention      720h;
    trace_log_level      debug;
    trace_intercept      on;

    server {
        listen       8080;
        server_name  localhost;

        trace on;
        trace_watch $uri $status $upstream_addr $request_method;
        trace_redact authorization cookie set-cookie;
        trace_upstream_capture headers;

        # ── Control plane (never traced) ──────────────────────────────────
        location /__trace/ {
            trace off;
            trace_control;
        }

        # ── Static routes ─────────────────────────────────────────────────
        location = /hello {
            trace_body_capture both;
            trace_body_max 1024;
            return 200 "hello from ngx-trace\n";
        }

        location = /json {
            trace_body_capture both;
            trace_body_max 4096;
            return 200 '{"status":"ok"}\n';
            add_header Content-Type application/json;
        }

        location = /fail {
            return 401 '{"error":"unauthorized"}\n';
            add_header Content-Type application/json;
        }

        # ── Subrequest ────────────────────────────────────────────────────
        location = /sub {
            auth_request /auth-sub;
            return 200 "main: subrequest OK\n";
        }

        location = /auth-sub {
            internal;
            proxy_pass http://127.0.0.1:9000/auth-check;
            proxy_pass_request_body off;
        }

        # ── Proxy to built-in echo backend (:9000) ────────────────────────
        location /proxy/ {
            proxy_pass http://127.0.0.1:9000/;
            trace_upstream_capture headers;
            trace_body_capture both;
        }

        # ── Proxy to httpbin (:8080 internal) ─────────────────────────────
        location /httpbin/ {
            proxy_pass http://httpbin:8080/;
            trace_upstream_capture headers;
            trace_body_capture both;
        }
    }

    # ── Built-in echo backend on :9000 ───────────────────────────────────
    server {
        listen       9000;
        server_name  localhost;

        location / {
            return 200 "echo: $request_method $uri\n";
            add_header X-Echo-Method $request_method;
            add_header X-Echo-Uri    $uri;
        }

        location = /auth-check {
            return 200 "allowed\n";
            add_header X-Auth-Result pass;
        }
    }
}
