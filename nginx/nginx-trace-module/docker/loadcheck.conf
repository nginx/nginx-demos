# docker/loadcheck.conf — minimal config to prove the module loads.
# Used by `nginx -t -c` as the M0.1 "done-when" check (block directives are not
# allowed in `-g`, so load_module must live in a real config file).
load_module /usr/local/nginx/modules/ngx_http_trace_module.so;
events {}
http {
    server {
        listen 8080;
        location / { trace on; return 200; }
    }
}
