# docker/nginx.test.conf — manual smoke-test config for the M0.1 loop.
# Used by `make up` (docker compose) so you can curl a traced route and confirm
# the module loads and is inert. The automated assertions live in t/*.t.

load_module /usr/local/nginx/modules/ngx_http_trace_module.so;

worker_processes  4;          # 4 workers for the later cross-worker test (AC-12)

events {
    worker_connections  1024;
}

http {
    # Module directive present but off — proves inert loading (M0.1).
    trace off;

    server {
        listen       8080;
        server_name  localhost;

        # A plain route: module loaded, does nothing.
        location = /hello {
            return 200 "ngx-trace: loaded and inert\n";
        }

        # A proxied route to the recording upstream (byte-exact target
        # exercised for real in M0.3 / M3).
        location = /proxy {
            proxy_pass http://upstream:9000/echo;
        }
    }
}
