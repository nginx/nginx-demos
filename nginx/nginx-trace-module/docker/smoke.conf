# docker/smoke.conf — manual smoke-test config exercising M0–M10 features.
# Usage: make sh  then  nginx -c /src/ngx-trace/docker/smoke.conf
# Port 8080 → traced routes + control plane
# Port 9000 → built-in echo backend for upstream capture testing

load_module /usr/local/nginx/modules/ngx_http_trace_module.so;

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # ── Main context: shared zone + global caps ─────────────────────────
    trace_zone        trace_zone  2m;
    trace_max_sessions   32;
    trace_max_transactions 64;
    trace_retention      720h;       # 30 days — effectively manual-stop only
    trace_log_level      debug;
    trace_intercept      on;          # Layer-2 per-module handler naming

    server {
        listen       8080;
        server_name  localhost;

        # ── Enable tracing at server level so all locations can be traced ─
        trace on;
        trace_watch $uri $status $upstream_addr $request_method;
        trace_redact authorization cookie set-cookie;
        trace_upstream_capture headers;

        # ── Control plane ─────────────────────────────────────────────────
        location /__trace/ {
            trace off;                               # never trace the API itself
            trace_control;                           # API + UI
        }

        # ── Routes ────────────────────────────────────────────────────────
        location = /hello {
            trace_body_capture both;
            trace_body_max 1024;
            return 200 "hello from ngx-trace\n";
        }

        location = /json {
            trace_body_capture both;
            trace_body_max 4096;
            # Echo back whatever was POSTed
            return 200 '{"status":"ok","trace":"active"}\n';
            add_header Content-Type application/json;
        }

        location = /fail {
            trace_body_capture both;
            return 401 '{"error":"unauthorized"}\n';
            add_header Content-Type application/json;
        }

        location /proxy/ {
            proxy_pass http://127.0.0.1:9000/;
            trace_upstream_capture headers;
            trace_body_capture both;
        }

        location = /sub {
            auth_request /auth-sub;               # triggers a subrequest
            trace_body_capture both;
            return 200 "main: subrequest OK\n";
        }

        location = /auth-sub {
            internal;                             # only reachable as subrequest
            proxy_pass http://127.0.0.1:9000/auth-check;
            proxy_pass_request_body off;
        }

        location = /slow {
            proxy_pass http://127.0.0.1:9000/delay;
            proxy_read_timeout 5s;
        }
    }

    # ── Echo backend on port 9000 (same process, no external deps) ─────
    server {
        listen       9000;
        server_name  localhost;

        location / {
            return 200 "echo: $request_method $uri\n";
            add_header X-Echo-Method $request_method;
            add_header X-Echo-Uri    $uri;
        }

        location = /auth-check {
            return 200 "allowed\n";
            add_header X-Auth-Result pass;
        }
    }
}
